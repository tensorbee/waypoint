[package]
name = "waypoint-cli"
version = "0.6.0"
edition = "2024"
# Edition 2024 requires 1.85; let-chains used in this crate require 1.88.
rust-version = "1.88"
description = "Lightweight, Flyway-compatible SQL migration CLI for PostgreSQL and MySQL"
license = "MIT"
repository = "https://github.com/tensorbee/waypoint"
homepage = "https://github.com/tensorbee/waypoint"
keywords = ["database", "migration", "postgresql", "mysql", "flyway"]
categories = ["command-line-utilities", "database"]
readme = "../README.md"
documentation = "https://docs.rs/waypoint-core"

[[bin]]
name = "waypoint"
path = "src/main.rs"

[dependencies]
waypoint-core = { version = "0.6.0", path = "../waypoint-core", default-features = false }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
colored = "3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
env_logger = "0.11"
ureq = { version = "3", features = ["json"], optional = true }
serde = { version = "1", features = ["derive"] }
semver = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
# Verifies the release SHA256SUMS entry before a downloaded binary is trusted.
sha2 = { version = "0.10", optional = true }

[features]
default = ["self-update", "postgres"]
self-update = ["dep:ureq", "dep:semver", "dep:flate2", "dep:tar", "dep:tempfile", "dep:sha2"]
postgres = ["waypoint-core/postgres"]
mysql = ["waypoint-core/mysql"]

[build-dependencies]
# Used by build.rs only, to stamp BUILD_TIME into the binary.
chrono = "0.4"
